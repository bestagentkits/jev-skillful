name: Eval gate

# The quality gate for the router itself.
#
# Runs when a change could plausibly alter a routing decision.
# It replays recorded model responses rather than calling the
# API, for two reasons that both matter:
#
#   1. No secret. A pull request from a fork has no access to
#      repository secrets, so a gate that needed a key could
#      never run on the contributions it most needs to check.
#      Replay needs none.
#   2. Comparability. The baseline and the head are scored
#      against the same recorded responses, so a difference in
#      the numbers is a difference in the code and not in the
#      model's mood.
#
# A change that regresses a metric fails.

on:
  pull_request:
    paths:
      - "packages/cli/src/core/router/**"
      - "packages/cli/src/core/retrieval/**"
      - "packages/cli/src/core/config/**"
      - "packages/cli/src/core/eval/**"
      - "bench/fixtures/**"
      - "bench/replay/**"
      - "bench/corpus/**"
      - ".github/workflows/eval-gate.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: replay eval, compare against base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Baseline: the PR's base commit, so the comparison is
      # against what this change would actually merge into.
      - name: Score base
        run: |
          BIN=packages/cli/dist/bin.js
          REPLAY=bench/replay/routing.json
          git worktree add ../base \
            "${{ github.event.pull_request.base.sha }}"
          cd ../base
          pnpm install --frozen-lockfile
          pnpm build
          node "$BIN" eval --replay "$REPLAY" \
            --repeat 5 --json > "$GITHUB_WORKSPACE/before.json"

      - name: Score head
        run: |
          node packages/cli/dist/bin.js eval \
            --replay bench/replay/routing.json \
            --repeat 5 --json > after.json

      - name: Compare
        run: node scripts/eval-gate-compare.mjs

      - name: Comment on the PR
        if: always() && !github.event.pull_request.head.repo.fork
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            if (!fs.existsSync("comment.md")) return;
            const body = fs.readFileSync("comment.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
